    <!-- Theme Boot: Read preference pre-paint to prevent flash of wrong theme -->
    <script>
      (function() {
        try {
          var t = localStorage.getItem('reflect_theme') || (document.cookie.match(/reflect_theme=(dark|light)/) || [])[1];
          if (t === 'light') {
            document.documentElement.setAttribute('data-theme', 'light');
            document.documentElement.classList.remove('dark');
          } else if (t === 'dark') {
            document.documentElement.setAttribute('data-theme', 'dark');
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.removeAttribute('data-theme');
            var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
            if (prefersDark) document.documentElement.classList.add('dark');
            else document.documentElement.classList.remove('dark');
          }
        } catch(e) {}
      })();
    </script>

            <span class="theme-label">Dark</span>
          </button>
          <button type="button" data-theme-btn="auto" onclick="setTheme('auto')" title="Follow system theme" aria-label="Use system theme">
            <span>⚙</span>
            <span class="theme-label">Auto</span>
          </button>
        </div>
        <a href="https://reflect.cloud" target="_blank" class="nav-link">Console &rarr;</a>
        <a href="https://docs.reflect.cloud" target="_blank" class="nav-link">Docs</a>
      </div>
    </div>

    <div id="app"></div>

    <!-- Theme Controller Script -->
    <script>
      function getThemePreference() {
        var stored = localStorage.getItem('reflect_theme');
        if (stored === 'light' || stored === 'dark') return stored;
        var match = document.cookie.match(/reflect_theme=(dark|light)/);
        if (match) return match[1];
        return 'auto';
      }

      function applyTheme(pref) {
        if (pref === 'light') {
          document.documentElement.setAttribute('data-theme', 'light');
          document.documentElement.classList.remove('dark');
        } else if (pref === 'dark') {
          document.documentElement.setAttribute('data-theme', 'dark');
          document.documentElement.classList.add('dark');
        } else {
          document.documentElement.removeAttribute('data-theme');
          var isDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          if (isDark) document.documentElement.classList.add('dark');
          else document.documentElement.classList.remove('dark');
        }
      }

      function updateThemeButtons(pref) {
        var buttons = document.querySelectorAll('[data-theme-btn]');
        buttons.forEach(function(btn) {
          var btnVal = btn.getAttribute('data-theme-btn');
          if (btnVal === pref) {
            btn.classList.add('active');
            btn.setAttribute('aria-pressed', 'true');
          } else {
            btn.classList.remove('active');
            btn.setAttribute('aria-pressed', 'false');
          }
        });
      }

      function setTheme(mode) {
        if (mode === 'light' || mode === 'dark') {
          localStorage.setItem('reflect_theme', mode);
          document.cookie = 'reflect_theme=' + mode + '; path=/; max-age=31536000; SameSite=Lax';
        } else {
          mode = 'auto';
          localStorage.removeItem('reflect_theme');
          document.cookie = 'reflect_theme=; path=/; expires=Thu, 01 Jan 1970 00:00:00 GMT; SameSite=Lax';
        }
        applyTheme(mode);
        updateThemeButtons(mode);
      }

      // Initialize UI button state
      var initialPref = getThemePreference();
      applyTheme(initialPref);
      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', function() {
          updateThemeButtons(initialPref);
        });
      } else {
        updateThemeButtons(initialPref);
      }

      // Live listener for OS preference changes when in Auto mode
      window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', function(e) {
        if (getThemePreference() === 'auto') {
          if (e.matches) document.documentElement.classList.add('dark');
          else document.documentElement.classList.remove('dark');
        }
      });
    </script>
  </body>
</html>
