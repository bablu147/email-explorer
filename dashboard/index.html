    <!-- Theme Boot: Read preference pre-paint to prevent flash of wrong theme -->
    <script>
      (function() {
        try {
          var t = localStorage.getItem('reflect_theme') || (document.cookie.match(/reflect_theme=(dark|light)/) || [])[1];
          var isDark = true;
          if (t === 'light') {
            isDark = false;
          } else if (t === 'dark') {
            isDark = true;
          } else {
            isDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          }
          if (isDark) {
            document.documentElement.setAttribute('data-theme', 'dark');
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.setAttribute('data-theme', 'light');
            document.documentElement.classList.remove('dark');
          }
          var metaTheme = document.querySelector('meta[name="theme-color"]');
          if (metaTheme) metaTheme.setAttribute('content', isDark ? '#0E1117' : '#F6F8FA');
        } catch(e) {}
      })();
    </script>

        --bg-2:          #FFFFFF;

        --accent-soft:   rgba(15, 140, 94, 0.10);

        --backdrop:      rgba(15, 23, 42, 0.40);
      }

      /* ── Base resets ─────────────────────────────────────────────────── */
      *, *::before, *::after {
        box-sizing: border-box;
      }

      html, body {
        margin: 0;
        padding: 0;
        height: 100%;
        background-color: var(--bg);
        color: var(--fg);
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }

      #app {

      }

      /* ── Scrollbars ──────────────────────────────────────────────────── */
      ::-webkit-scrollbar {
        width: 6px;

      }
      ::-webkit-scrollbar-track {
        background: transparent;
      }
      ::-webkit-scrollbar-thumb {
        background: var(--border-strong);
        border-radius: 9999px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: var(--fg-faint);
      }

      /* ── Selection ───────────────────────────────────────────────────── */
      ::-moz-selection {
        background: var(--selection);
        color: var(--fg);
      }
      ::selection {
        background: var(--selection);
        color: var(--fg);
      }

      /* ── Iframe Email Canvas ─────────────────────────────────────────── */
      iframe[sandbox],
      iframe[srcdoc],
      .flex-grow > iframe {
        width: 100%;
        min-height: 480px;
        height: 100%;
        display: block;
        background-color: #ffffff;
        border: none;
      }

      /* ── Tooltips ────────────────────────────────────────────────────── */
      .group:hover > div.absolute.bottom-full,
      button:hover > div.absolute.bottom-full,
      a:hover > div.absolute.bottom-full {
        pointer-events: none;
      }
